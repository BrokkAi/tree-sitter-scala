name: Grammar CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grammar:
    name: Grammar and Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.26.3
      - name: Test checked-in grammar and upstream corpus
        run: tree-sitter test --rebuild
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Test Rust bindings and regressions
        run: cargo test --locked
      - name: Lint Rust bindings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify standalone Rust package
        run: cargo package --locked
